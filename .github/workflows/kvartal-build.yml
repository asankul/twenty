# Своя сборка Twenty для отдела продаж «Квартал».
#
# Собирает образ из этой ветки и кладёт в реестр GitHub. Сервер тянет
# оттуда вместо официального twentycrm/twenty — так правки в интерфейсе
# доезжают до прода, а не живут скриптом поверх чужой страницы.
name: Сборка образа Kvartal

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'packages/twenty-website/**'
      - 'packages/twenty-docs/**'
  workflow_dispatch:

concurrency:
  group: kvartal-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на диске
        # Образ с зависимостями не влезает в стандартные 14 ГБ свободного места
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/twenty:latest
            ghcr.io/${{ github.repository_owner }}/twenty:${{ github.sha }}
          build-args: |
            APP_VERSION=kvartal-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Итог
        run: echo "образ ghcr.io/${{ github.repository_owner }}/twenty:latest готов"
